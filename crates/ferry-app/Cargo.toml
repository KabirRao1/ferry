[package]
name = "ferry-app"
description = "Ferry application state and update logic (Elm architecture). No rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
bytes.workspace = true
# Local time zone for history dates (F10-AC3).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Randomness for dynamic variables (F08-AC7).
fastrand = "2"
ferry-core.workspace = true
ferry-http.workspace = true
ferry-script.workspace = true
ferry-store.workspace = true
# Visualize templates (F22-AC5, ADR-0046).
handlebars = { version = "6", default-features = false }
serde.workspace = true
serde_json.workspace = true
# Scripts run on blocking threads beside the send (F15).
tokio = { workspace = true, features = ["rt"] }
url.workspace = true

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
wiremock.workspace = true

[lints]
workspace = true
