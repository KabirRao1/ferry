[package]
name = "ferry-http"
description = "Ferry HTTP execution: sending, timing capture and cancellation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
bytes.workspace = true
ferry-core.workspace = true
# rustls with the `ring` provider: builds with only a C compiler (no CMake/NASM).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "brotli", "deflate", "zstd", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
tower-layer = "0.3"
tower-service = "0.3"
url.workspace = true

[dev-dependencies]
flate2 = "1"
rcgen = "0.14"
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
wiremock.workspace = true

[lints]
workspace = true
