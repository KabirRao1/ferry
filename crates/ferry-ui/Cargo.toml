[package]
name = "ferry-ui"
description = "Ferry native UI (iced). Views are functions of ferry-app state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "ferry"
path = "src/main.rs"

[dependencies]
ferry-app.workspace = true
# CPU rendering by default: ~10x less memory and ~10x faster cold start than wgpu (ADR-0018).
# `tokio`: effects (HTTP sends) run on the tokio runtime that reqwest needs.
# `selector`: finds the body area's bounds, where the preview web view goes (F22).
iced = { workspace = true, features = ["tiny-skia", "tokio", "x11", "wayland", "selector"] }
# Native file dialogs for form-data and binary bodies (F03-AC5, F03-AC6).
rfd = "0.17"
tokio = { workspace = true, features = ["rt"] }

# The Preview web view (F22, ADR-0041): WebView2 on Windows, WKWebView on macOS.
# Linux offers Open in Browser instead, so it needs no WebKitGTK.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = { version = "0.57", default-features = false }

[features]
default = []
# Opt-in GPU rendering (wgpu). iced falls back to tiny-skia when no GPU is available.
gpu = ["iced/wgpu"]

[dev-dependencies]
iced_test.workspace = true

[lints]
workspace = true
