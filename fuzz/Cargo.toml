[package]
name = "ferry-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferry-core = { path = "../crates/ferry-core" }
ferry-script = { path = "../crates/ferry-script" }

# Not part of the root workspace (ADR-0009).
[workspace]

[[bin]]
name = "line_index"
path = "fuzz_targets/line_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_pretty"
path = "fuzz_targets/json_pretty.rs"
test = false
doc = false
bench = false

[[bin]]
name = "params_sync"
path = "fuzz_targets/params_sync.rs"
test = false
doc = false
bench = false

[[bin]]
name = "set_cookie"
path = "fuzz_targets/set_cookie.rs"
test = false
doc = false
bench = false

[[bin]]
name = "variables"
path = "fuzz_targets/variables.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workspace_formats"
path = "fuzz_targets/workspace_formats.rs"
test = false
doc = false
bench = false

[[bin]]
name = "script"
path = "fuzz_targets/script.rs"
test = false
doc = false
bench = false
