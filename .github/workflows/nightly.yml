# Long fuzzing and full mutation testing (ADR-0009, ADR-0010).
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run fuzz targets (15 min each)
        working-directory: fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=900
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # The full run takes longer than one job's 3-hour limit, so it is split into
  # shards that run in parallel (each shard tests every 8th mutant).
  mutants:
    name: mutants (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-mutants
      - run: cargo xtask mutants --all --shard ${{ matrix.shard }}/8 --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-out-${{ matrix.shard }}
          path: mutants.out
