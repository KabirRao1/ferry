[calibration]
date = "2026-10-19"
machine = "Windows 11 Home 10.0.26200, 16 logical CPUs"
method = "Release builds; `ferry` is built on its own, as released (FND-018). Cold start: median of 5 launches, process spawn to first frame (FERRY_PROBE marker). Idle RSS: working set with 10 tabs open (FERRY_PROBE_TABS), 1.5 s after first frame, median of 5. Scroll: scroll_probe example, 50 MB body, 300 frames with ICED_PRESENT_MODE=immediate, p95 frame interval. Baseline: examples/empty_window with the same iced features plus those iced_test adds."

# Linux and macOS: from CI run 39364317363 (GitHub-hosted runners). Binary
# sizes are the logged MB values (1 MB = 1048576 bytes), within 0.005 MB.
