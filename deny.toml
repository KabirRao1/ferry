# cargo-deny: licenses, advisories, duplicate versions, sources (gate step 5).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) crates reached only through iced. Revisit on iced upgrades (ADR-0004).
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: proc-macro via wgpu-hal -> metal (macOS); compile-time only" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: via cosmic-text font loading; no maintained drop-in yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    # Permissive data license of the Mozilla root certificates (webpki-root-certs, via reqwest).
    "CDLA-Permissive-2.0",
]

[bans]
# iced and reqwest pull several versions of platform crates; tracked, not fatal (ADR-0004).
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
